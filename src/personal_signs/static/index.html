<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal ISL Signs</title>
<style>
  :root { --bg:#f5f6fb; --card:#fff; --ink:#1d2040; --muted:#5d6280; --accent:#3a4bd8; --ok:#1d7a46; --warn:#a86400; --bad:#b3261e; --line:#dfe2ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12131c; --card:#1c1e2b; --ink:#eceefa; --muted:#a3a7c2; --accent:#8c98ff; --ok:#5cc98a; --warn:#f0b35a; --bad:#ff8a80; --line:#2c2f42; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .grid { display:grid; gap:16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1.1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  video { width:100%; aspect-ratio: 4/3; background:#000; border-radius:10px; object-fit:cover; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { flex:1 1 140px; padding:10px 12px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:12px; min-height:1.5em; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  ul { padding-left: 18px; margin: 6px 0; }
  details { margin-top: 12px; color: var(--muted); }
  code { font-size: .85em; }
</style>
</head>
<body>
<main>
  <h1>Personal ISL Signs</h1>
  <p class="lead">Teach the recognizer your own way of signing with a few short clips, then let it recognize you.</p>

  <div class="grid">
    <section class="card">
      <video id="camera" autoplay muted playsinline></video>
      <div class="row">
        <button id="start" class="secondary">Start camera</button>
        <button id="flip" class="secondary" hidden>Switch camera</button>
      </div>
      <p style="color:var(--muted);font-size:.9rem;margin:10px 0 0">Frame yourself from head to waist with both hands visible. Each recording lasts <span id="seconds">2.5</span> s.</p>
    </section>

    <section class="card">
      <div id="account" hidden>
        <div id="loggedOut">
          <h3 style="margin:0 0 4px;font-size:1rem">Your account</h3>
          <p style="margin:0;color:var(--muted);font-size:.9rem">Your signs are private to your account.</p>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email">
          <label for="password">Password (at least 8 characters)</label>
          <input id="password" type="password" autocomplete="current-password" minlength="8">
          <div class="row">
            <button id="login">Log in</button>
            <button id="signup" class="secondary">Sign up</button>
          </div>
        </div>
        <div id="loggedIn" hidden class="row" style="align-items:center;margin-top:0">
          <span id="who" style="flex:2 1 160px;color:var(--muted)"></span>
          <button id="logout" class="secondary" style="flex:0 1 110px">Log out</button>
        </div>
        <hr style="border:none;border-top:1px solid var(--line);margin:14px 0 4px">
      </div>
      <label for="label">Sign name</label>
      <input id="label" placeholder="e.g. hello" maxlength="40">
      <label for="kind">Type</label>
      <select id="kind">
        <option value="isl_variant">My way of an ISL sign</option>
        <option value="custom_gesture">My own custom gesture</option>
      </select>
      <div class="row">
        <button id="record" disabled>Record example</button>
        <button id="train" class="secondary">Train</button>
        <button id="recognize" class="secondary" disabled>Recognize</button>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="confirm" hidden class="row">
        <button id="saveAnyway">Save anyway</button>
        <button id="discard" class="secondary">Discard</button>
      </div>
      <div id="answer" hidden>
        <div class="row">
          <button id="answerYes">Yes</button>
          <button id="answerNo" class="secondary">No</button>
        </div>
        <div id="correct" hidden>
          <label for="correctSign">Which sign was it?</label>
          <select id="correctSign"></select>
          <div class="row">
            <button id="saveCorrect">Save as this sign</button>
            <button id="skipCorrect" class="secondary">Skip</button>
          </div>
        </div>
      </div>
      <div id="ranking" style="color:var(--muted);font-size:.85rem;margin-top:6px"></div>
      <h3 style="margin:18px 0 4px;font-size:1rem">Saved signs</h3>
      <ul id="signs"><li style="color:var(--muted)">None yet.</li></ul>
      <details>
        <summary>Settings</summary>
        <label for="server">Engine address (empty = this server)</label>
        <input id="server" placeholder="http://localhost:8000" autocomplete="off">
        <label for="user">Profile name (X-User)</label>
        <input id="user" value="default" maxlength="64">
        <label for="key">API key (only if the server requires one)</label>
        <input id="key" type="password" autocomplete="off">
      </details>
    </section>
  </div>
</main>
<script>
const RECORD_MS = 2500;
const $ = (id) => document.getElementById(id);
let stream = null;
let pendingClip = null;        // last recorded example waiting for "Save anyway"
let lastClip = null;           // last clip sent to Recognize
let lastSuggestion = "";       // what Recognize thought it was
let savedSigns = [];           // sign names from the server, for "Which sign was it?"

function store(name, value) { try { localStorage.setItem(name, value); } catch (_) {} }
function load(name) { try { return localStorage.getItem(name); } catch (_) { return null; } }
$("user").value = load("ps-user") || "default";
$("user").addEventListener("change", () => { store("ps-user", $("user").value); refresh(); });
$("key").addEventListener("change", () => refresh());

// Where the recognition engine runs. Served by the engine itself: same origin.
// Served by the website: the engine on this device (http://localhost:8000),
// unless the user sets another address (e.g. a hosted https server).
const servedByEngine = !location.hostname.endsWith("signbridgeco.xyz");
$("server").value = load("ps-server") ?? (servedByEngine ? "" : "http://localhost:8000");
$("server").addEventListener("change", () => { store("ps-server", $("server").value.trim()); refresh(); });
const serverBase = () => $("server").value.trim().replace(/\/+$/, "");

// Accounts: when the engine says it uses PocketBase, people sign up / log in
// there and send their login token to the engine.
let authMode = "none";
let pocketbaseUrl = "";
let session = null;  // { token, email }
try { session = JSON.parse(load("ps-session") || "null"); } catch (_) { session = null; }
function loggedIn() { return authMode !== "pocketbase" || !!(session && session.token); }

function showAccount() {
  $("account").hidden = authMode !== "pocketbase";
  $("loggedOut").hidden = loggedIn();
  $("loggedIn").hidden = !loggedIn() || authMode !== "pocketbase";
  $("who").textContent = session ? "Logged in as " + session.email : "";
  busy(false);
}

function forgetSession(message) {
  session = null;
  store("ps-session", "");
  showAccount();
  if (message) setStatus(message, "warn");
}

async function pocketbase(path, body) {
  let response;
  try {
    response = await fetch(pocketbaseUrl + path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
  } catch (_) { throw new Error("Can't reach the account server. Try again in a moment."); }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const fields = Object.values(data.data || {}).map((f) => f.message).filter(Boolean);
    throw new Error(fields.join(" ") || data.message || "Request failed.");
  }
  return data;
}

async function logIn(email, password) {
  const data = await pocketbase("/api/collections/users/auth-with-password", { identity: email, password });
  session = { token: data.token, email: data.record.email || email };
  store("ps-session", JSON.stringify(session));
  $("password").value = "";
  showAccount();
  setStatus("Welcome! You're logged in.", "ok");
  await refresh();
}

$("login").onclick = async () => {
  try { await logIn($("email").value.trim(), $("password").value); }
  catch (error) { setStatus("Could not log in: " + error.message, "bad"); }
};
$("signup").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  if (password.length < 8) { setStatus("Use a password with at least 8 characters.", "warn"); return; }
  try {
    await pocketbase("/api/collections/users/records", { email, password, passwordConfirm: password });
    await logIn(email, password);
  } catch (error) { setStatus("Could not sign up: " + error.message, "bad"); }
};
$("logout").onclick = () => { forgetSession(); $("signs").replaceChildren(); setStatus("Logged out."); };

async function loadConfig() {
  try {
    const response = await fetch(serverBase() + "/config");
    const config = await response.json();
    authMode = config.auth || "none";
    pocketbaseUrl = (config.pocketbase_url || "").replace(/\/+$/, "");
  } catch (_) { authMode = "none"; }
  // Profile names and API keys only apply when there are no accounts.
  for (const id of ["user", "key"]) {
    $(id).hidden = authMode === "pocketbase";
    document.querySelector(`label[for="${id}"]`).hidden = authMode === "pocketbase";
  }
  showAccount();
}

function headers(extra = {}) {
  if (authMode === "pocketbase") {
    return session ? { "Authorization": "Bearer " + session.token, ...extra } : { ...extra };
  }
  const h = { "X-User": $("user").value.trim() || "default", ...extra };
  const key = $("key").value.trim();
  if (key) h["Authorization"] = "Bearer " + key;
  return h;
}

const readable = (label) => (label || "").replaceAll("_", " ").toUpperCase();
function setStatus(text, tone = "") { $("status").className = tone; $("status").textContent = text; }
function busy(on) {
  for (const id of ["record", "train", "recognize"]) $(id).disabled = on || !loggedIn() || (id !== "train" && !stream);
}

// Hide every follow-up question so old buttons never act on a different clip.
function resetPrompts() {
  $("confirm").hidden = true;
  $("answer").hidden = true;
  $("answerYes").hidden = false;  // a "not recognized" result hides it; always bring it back
  $("correct").hidden = true;
  $("ranking").textContent = "";
  pendingClip = null;
}

async function api(path, options = {}) {
  let response;
  try {
    response = await fetch(serverBase() + path, { ...options, headers: headers(options.headers) });
  } catch (_) {
    throw new Error(`Can't reach the recognition engine at ${serverBase() || location.origin}. ` +
      "Start it on this device (or connect the phone by USB), or set its address under Settings.");
  }
  const data = await response.json().catch(() => ({}));
  if (response.status === 401 && authMode === "pocketbase") {
    forgetSession();
    throw new Error(data.detail || "Please log in again.");
  }
  if (!response.ok) throw new Error(data.detail || response.statusText);
  return data;
}

let facing = "user";  // front camera first; "environment" = back camera

function stopCamera() {
  if (stream) stream.getTracks().forEach((track) => track.stop());
  stream = null;
  $("camera").srcObject = null;
  busy(false);
}

async function startCamera() {
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: facing },
      audio: false,
    });
    const video = $("camera");
    video.srcObject = stream;
    // Phones do not always start a live preview by themselves.
    await video.play().catch(() => {});
    await new Promise((resolve) => setTimeout(resolve, 800));
    if (!video.videoWidth) {
      stopCamera();
      setStatus("The camera is not sending a picture. Close other tabs or apps that use the camera, then tap Start camera again.", "bad");
      return;
    }
    $("flip").hidden = false;
    busy(false);
    setStatus("Camera ready.");
  } catch (error) { stopCamera(); setStatus("Camera not available: " + error.message, "bad"); }
}

$("start").onclick = startCamera;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCamera(); };

// Release the camera when this tab is hidden, so another tab or app can use it.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && stream) { stopCamera(); setStatus("Camera paused. Tap Start camera to continue."); }
});

function recordClip() {
  return new Promise((resolve, reject) => {
    const type = ["video/webm;codecs=vp8", "video/webm", "video/mp4"].find((t) => MediaRecorder.isTypeSupported(t));
    const recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    recorder.ondataavailable = (event) => event.data.size && chunks.push(event.data);
    recorder.onstop = () => {
      const clip = new Blob(chunks, { type: recorder.mimeType });
      // An almost empty file means the camera delivered no frames.
      if (clip.size < 2000) reject(new Error("The recording is empty. Close other tabs or apps using the camera, then tap Start camera again."));
      else resolve(clip);
    };
    recorder.onerror = (event) => reject(event.error);
    recorder.start();
    setTimeout(() => recorder.stop(), RECORD_MS);
  });
}

async function countdown() {
  for (const n of [3, 2, 1]) { setStatus("Recording in " + n + "…"); await new Promise((r) => setTimeout(r, 700)); }
  setStatus("Recording… sign now.");
}

// Existing signs keep their saved type, so the type is only sent for new signs.
async function addExample(label, clip, confirm) {
  const query = new URLSearchParams({ confirm: String(confirm) });
  if (!savedSigns.includes(label.toLowerCase().replaceAll(" ", "_"))) query.set("kind", $("kind").value);
  return api("/signs/" + encodeURIComponent(label) + "?" + query, { method: "POST", body: clip });
}

function showGate(result) {
  if (result.saved) {
    const note = result.decision === "accepted" && result.reasons.length ? " " + result.reasons.join(" ") : "";
    setStatus(`Saved ${readable(result.label)} example (${result.samples_for_sign} so far).${note}`, "ok");
  } else if (result.decision === "needs_confirmation") {
    setStatus("Check this example: " + result.reasons.join(" "), "warn");
    $("confirm").hidden = false;
  } else {
    setStatus("Not saved: " + result.reasons.join(" "), "bad");
  }
}

$("record").onclick = async () => {
  const label = $("label").value.trim();
  if (!label) { setStatus("Type a sign name first.", "warn"); return; }
  resetPrompts(); busy(true);
  try {
    await countdown();
    const clip = await recordClip();
    setStatus("Checking the clip…");
    const result = await addExample(label, clip, false);
    showGate(result);
    if (result.decision === "needs_confirmation" && !result.saved) pendingClip = { label, clip };
    await refresh();
  } catch (error) { setStatus("Could not save: " + error.message, "bad"); }
  busy(false);
};

$("saveAnyway").onclick = async () => {
  if (!pendingClip) return;
  const { label, clip } = pendingClip;
  resetPrompts(); busy(true);
  try { showGate(await addExample(label, clip, true)); await refresh(); }
  catch (error) { setStatus("Could not save: " + error.message, "bad"); }
  busy(false);
};
$("discard").onclick = () => { resetPrompts(); setStatus("Discarded."); };

async function train(quiet = false) {
  const result = await api("/train", { method: "POST" });
  const v = result.validation;
  const check = v ? ` Self-check: ${Math.round(v.accuracy * 100)}% (${v.correct}/${v.total}).` : "";
  if (!quiet) setStatus(`Ready: ${result.sign_count} signs from ${result.clip_count} clips.${check}`, "ok");
  return result;
}

$("train").onclick = async () => {
  resetPrompts(); busy(true); setStatus("Training…");
  try { await train(); } catch (error) { setStatus("Could not train yet: " + error.message, "bad"); }
  busy(false);
};

function showRanking(result) {
  const items = (result.ranking || []).map((r) => `${readable(r.label)} ${r.distance.toFixed(3)}`);
  if (items.length) $("ranking").textContent = "Closest (lower = more alike): " + items.join(" · ") + "   (match < 0.100, ask < 0.140)";
}

$("recognize").onclick = async () => {
  resetPrompts(); busy(true);
  try {
    await countdown();
    const clip = await recordClip();
    setStatus("Recognizing…");
    const r = await api("/recognize", { method: "POST", body: clip });
    lastClip = clip;
    lastSuggestion = r.suggestion || "";
    showRanking(r);
    if (r.decision === "accepted") {
      setStatus("Recognized: " + readable(r.suggestion), "ok");
    } else if (r.decision === "confirm") {
      setStatus("Was this " + readable(r.suggestion) + "?", "warn");
      $("answer").hidden = false;
    } else {
      setStatus("Not recognized. " + r.reason, "bad");
      if (savedSigns.length) { fillCorrect(); $("answer").hidden = false; $("answerYes").hidden = true; $("correct").hidden = false; }
    }
  } catch (error) { setStatus("Could not recognize: " + error.message, "bad"); }
  busy(false);
};

function fillCorrect() {
  const select = $("correctSign");
  select.replaceChildren(...savedSigns.map((name) => {
    const option = document.createElement("option");
    option.value = name; option.textContent = readable(name);
    return option;
  }));
  if (savedSigns.includes(lastSuggestion)) select.value = lastSuggestion;
}

// Teach from the answer: the clip just signed becomes a new example of the
// right sign, then the model is rebuilt so the next try uses it.
async function learnFrom(label) {
  resetPrompts(); $("answerYes").hidden = false; busy(true);
  try {
    setStatus("Adding this clip to " + readable(label) + "…");
    const saved = await addExample(label, lastClip, true);
    if (!saved.saved) { showGate(saved); busy(false); return; }
    await train(true);
    setStatus(`Thanks! Added to ${readable(label)} (${saved.samples_for_sign} examples) and retrained.`, "ok");
    await refresh();
  } catch (error) { setStatus("Could not add it: " + error.message, "bad"); }
  lastClip = null;
  busy(false);
}

$("answerYes").onclick = () => learnFrom(lastSuggestion);
$("answerNo").onclick = () => { fillCorrect(); $("correct").hidden = false; };
$("saveCorrect").onclick = () => learnFrom($("correctSign").value);
$("skipCorrect").onclick = () => { resetPrompts(); $("answerYes").hidden = false; lastClip = null; setStatus("Okay, nothing was saved."); };

async function refresh() {
  try {
    const data = await api("/signs");
    savedSigns = Object.keys(data.samples);
    const list = $("signs");
    list.replaceChildren();
    if (!savedSigns.length) { const li = document.createElement("li"); li.textContent = "None yet."; li.style.color = "var(--muted)"; list.append(li); }
    for (const [label, count] of Object.entries(data.samples)) {
      const li = document.createElement("li");
      const kind = data.details[label]?.kind === "custom_gesture" ? " (custom)" : "";
      li.textContent = `${label.replaceAll("_", " ")}${kind}: ${count} clip${count === 1 ? "" : "s"}`;
      list.append(li);
    }
  } catch (error) {
    if (!$("status").textContent) setStatus(error.message, "warn");
  }
}
loadConfig().then(() => { if (loggedIn()) refresh(); else setStatus("Log in or sign up to start teaching your signs."); });
</script>
</body>
</html>
